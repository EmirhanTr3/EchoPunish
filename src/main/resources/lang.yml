  broadcast: "<primary><secondary><player></secondary> has been temporarily banned by <secondary><mod></secondary> for <secondary><duration></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been temporarily banned."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Duration: <secondary><duration></secondary> (<secondary><timeleft></secondary>)"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
banip:
