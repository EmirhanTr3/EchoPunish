  not: "<error><player> is not ip banned.</error>"
  broadcast: "<primary><secondary><player></secondary> has been ip banned by <secondary><mod></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been ip banned."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
tempbanip:
  exempt: "<error>You cannot ban this player.</error>"
  broadcast: "<primary><secondary><player></secondary> has been temporarily ip banned by <secondary><mod></secondary> for <secondary><duration></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been temporarily ip banned."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Duration: <secondary><duration></secondary> (<secondary><timeleft></secondary>)"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"

unwarn:
  broadcast: "<primary><secondary><player></secondary> has been unwarned by <secondary><mod></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been unwarned."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
unmute:
  broadcast: "<primary><secondary><player></secondary> has been unmuted by <secondary><mod></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been unmuted."
    - "<primary>Moderator: <secondary><mod>"
