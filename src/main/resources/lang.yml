# Silent is appended to the end of the broadcast string.
silent: " <gray>(Silent)</gray>"

warn:
  exempt: "<error>You cannot warn this player.</error>"
  broadcast: "<primary><secondary><player></secondary> has been warned by <secondary><mod></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been warned."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
kick:
  exempt: "<error>You cannot kick this player.</error>"
  broadcast: "<primary><secondary><player></secondary> has been kicked by <secondary><mod></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been kicked."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
mute:
  exempt: "<error>You cannot mute this player.</error>"
  not: "<error><player> is not muted.</error>"
  broadcast: "<primary><secondary><player></secondary> has been muted by <secondary><mod></secondary> for <secondary><duration></secondary> for <secondary><reason></secondary></primary>"
  message:
    - "<primary>You have been muted."
    - "<primary>Moderator: <secondary><mod>"
    - "<primary>Duration: <secondary><duration></secondary> (<secondary><timeleft></secondary>)"
    - "<primary>Reason: <secondary><reason>"
    - "<gray>#<id></gray>"
